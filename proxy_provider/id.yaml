base-proxy:
  vmess:
    - &basevmess
      type: vmess
      alterId: 0
      cipher: auto
      udp: true
      udp-over-tcp: true
      packet-encoding: xudp
      network: ws
      smux:
        enabled: false
        protocol: smux
        only-tcp: false
  vless:
    - &basevless
      type: vless
      alterId: 0
      cipher: auto
      udp: true
      udp-over-tcp: true
      packet-encoding: xudp
      network: ws
      smux:
        enabled: false
        protocol: smux
        only-tcp: false
  trojan:
    - &basetrojan
      type: trojan
      udp: true
      packet-encoding: xudp
      network: ws
      smux:
        enabled: false
        protocol: smux
        only-tcp: false
  gfw:
    - &basegrpc
      type: trojan
      port: 443
      udp: true
base-proxy-group:
  url:
    - &url-gg http://www.gstatic.com/generate_204
    - &url-cf http://cp.cloudflare.com/generate_204
