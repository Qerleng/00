p: &p {type: http, interval: 86400, proxy: DIRECT, header: {User-Agent: ["Clash.Meta/mihomo/Alpha/1.18.6"]}, health-check: {enable: true, url: https://cp.cloudflare.com, interval: 300, lazy: false}}

proxy-providers:
  provider1:
    <<: *p
    path: "./assets/provider/proxy/game.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/game.yaml"

  provider2:
    <<: *p
    path: "./assets/provider/proxy/test-sgp.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/test-sgp.yaml"
  
  provider3:
    <<: *p
    path: "./assets/provider/proxy/test-sg.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/test-sg.yaml"

  provider4:
    <<: *p
    path: "./assets/provider/proxy/test.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/test.yaml"
  
  provider5:
    <<: *p
    path: "./assets/provider/proxy/id.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/id.yaml"

  provider6:
    <<: *p
    path: "./assets/provider/proxy/sg.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/sg.yaml"
  
  provider7:
    <<: *p
    path: "./assets/provider/proxy/test-id.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/test-id.yaml"

  provider8:
    <<: *p
    path: "./assets/provider/proxy/test-idn.yaml"
    url: "https://raw.githubusercontent.com/Qerleng/00/main/proxy_provider/test-idn.yaml"

select: &select {type: select, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
url-test: &test {type: url-test, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
fallback: &fallback {type: fallback, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
load-balance-ch: &hashing {type: load-balance, strategy: consistent-hashing, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
load-balance-rb: &round {type: load-balance, strategy: round-robin, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
load-balance-ss: &sticky {type: load-balance, strategy: sticky-sessions, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}
relay: &relay {type: relay, url: 'http://www.gstatic.com/generate_204', interval: 300, lazy: false}


proxy-groups:
- name: 📶SELECT-VPN📶
  <<: *select
  proxies: [URL-test, LOADBALANCE, FALLBACK]

- name: URL-test
  <<: *test
  use: [provider8]

- name: LOADBALANCE
  <<: *sticky
  use: [provider7]
  
- name: FALLBACK
  <<: *round
  use: [ provider8, provider7]
  
  
rule-anchor:
  ip: &ip {type: http, interval: 43200, behavior: ipcidr, proxy: 📶SELECT-VPN📶, format: mrs}
  domain: &domain {type: http, interval: 43200, behavior: domain, proxy: 📶SELECT-VPN📶, format: mrs}

